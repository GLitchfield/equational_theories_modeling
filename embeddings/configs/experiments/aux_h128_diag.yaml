# aux_h128_diag — Test 1 from aux_heads_implementation_plan.md.
#
# Auxiliary heads at h=128 paired with the current best contrastive +
# VICReg recipe (margin 1.5, VICReg 0.1/0.1, true_weight 1.0) — the
# same setup that produced stable_m1p5_vic0p1_diag at bal_acc 0.9492
# (ep6). Test question: do aux heads help at h=128 where training is
# already stable? If yes, the encoder was suppressing some useful
# structural features; if no (within 0.5pp), h=128 was already
# capturing them and aux heads are redundant at this width.
#
# Single-knob change vs stable_m1p5_vic0p1_diag.yaml: aux heads
# enabled (loss.aux_weight=0.1, data.aux_labels_path set).

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  equations_file: data/raw/etp/equations.txt
  pair_table_path: data/processed/implication_pairs.parquet
  graph_cache_path: data/processed/equation_graphs.pt
  holdout_path: null
  num_workers: 4
  # Built by scripts/build_equation_invariants.py from the sibling
  # equational_theories_data project. Per-equation labels for the 10
  # auxiliary heads (spine, lhs_structure, num_variables, 7 magma bits).
  aux_labels_path: data/processed/equation_invariants.parquet

encoder:
  node_features: 9
  edge_features: 4
  hidden_dim: 128
  embed_dim: 512
  num_layers: 4
  num_heads: 4
  dropout: 0.1

predictor:
  embed_dim: 512
  hidden_dim: 128
  num_layers: 2

ema:
  tau_start: 0.996
  tau_final: 0.999
  schedule: cosine

training:
  batch_size: 2048
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_steps: 1000
  epochs: 10
  grad_clip_norm: 1.0
  checkpoint_dir: outputs/checkpoints
  max_val_batches: 200

loss:
  type: contrastive
  margin: 1.5
  true_weight: 1.0
  vicreg_var_weight: 0.1
  vicreg_cov_weight: 0.1
  vicreg_gamma: 1.0
  # Auxiliary anchor weight. Plan recommends 0.1 — large enough to
  # anchor features but secondary to the contrastive objective.
  # Avg cross-entropy at random init across the 10 heads is ~ln(2-6)
  # ~ 1.0; with aux_weight=0.1 that's 0.1 added to contrastive ~ 0.7,
  # ~14% of total loss at init.
  aux_weight: 0.1

holdout:
  level: 1
  level1_ratio: 0.10
  level2_num_equations: 500
  level3_num_equiv_classes: 150
  seed: 42

wandb:
  enabled: true
  project: jepa-equational-implication
  entity: null
  name: aux_h128_diag
  log_every: 25

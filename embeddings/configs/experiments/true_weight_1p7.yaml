# true_weight = 1.7 — inverse-prevalence upweighting of TRUE pairs.
#
# Hypothesis: the baseline's recall gap (true 0.753 vs false 0.871) is
# driven by the corpus's FALSE skew (62.9% FALSE / 37.1% TRUE → ratio
# 1.695:1). Setting `loss.true_weight` to the inverse-prevalence value
# (~1.7) equalizes per-class contribution to the contrastive loss and
# should narrow the recall gap, moving balanced accuracy upward.
#
# Watch: false_recall is expected to drop somewhat — the question is
# whether true_recall rises enough to net-improve balanced accuracy.
#
# Result: embeddings/outputs/results/true_weight_1p7.json
# Reproduce: python embeddings/scripts/run_experiment.py embeddings/configs/experiments/true_weight_1p7.yaml

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  equations_file: data/raw/etp/equations.txt
  pairs_file: data/raw/etp/2025-08-11-vampire.json.gz
  pair_table_path: data/processed/implication_pairs.parquet
  graph_cache_path: data/processed/equation_graphs.pt
  holdout_path: data/splits/level1_holdout_seed42.parquet
  num_workers: 4

encoder:
  node_features: 9
  edge_features: 4
  hidden_dim: 128
  embed_dim: 64
  num_layers: 4
  num_heads: 4
  dropout: 0.1

predictor:
  embed_dim: 64
  hidden_dim: 128
  num_layers: 2

ema:
  tau_start: 0.996
  tau_final: 0.999
  schedule: cosine

training:
  batch_size: 2048
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_steps: 1000
  epochs: 10
  grad_clip_norm: 1.0
  checkpoint_dir: embeddings/outputs/checkpoints
  max_val_batches: 200

loss:
  type: contrastive
  margin: 1.0
  true_weight: 1.7
  vicreg_weight: 0.0

holdout:
  level: 1
  level1_ratio: 0.10
  level2_num_equations: 500
  level3_num_equiv_classes: 150
  seed: 42

wandb:
  enabled: true
  project: jepa-equational-implication
  entity: null
  name: true_weight_1p7
  log_every: 50

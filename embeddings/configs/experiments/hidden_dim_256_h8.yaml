# hidden_dim=256, num_heads 4 → 8 — restore per-head dim to 32.
#
# When hidden_dim doubled (128 → 256) but num_heads stayed at 4, the
# per-head dim doubled (32 → 64). The smaller working configs all had
# per_head_dim=32. This experiment restores per_head_dim=32 by using
# num_heads=8, isolating per-head capacity as a possible cause of the
# wider-GAT failure.
#
# Decision rule:
#   - bal_acc > 0.846 → per-head dim was the issue. Wider GAT works
#     when per_head_dim stays at 32. Lock in this architecture.
#   - bal_acc ≈ hidden_dim_256 (0.817) → per-head wasn't the issue;
#     wider GAT genuinely doesn't help. Lock in hidden_dim=128, move
#     on to other levers (depth, loss form, L2/L3 holdouts).
#
# Param counts (essentially unchanged from hidden_dim_256.yaml):
#   encoder   ~668K (8 heads of 32 vs 4 heads of 64; total output dim
#             same; only the attention vector grows slightly: 4*64=256
#             vs 8*32=256 — actually identical, both 256)
#   predictor 65,920
#   total     ~734K
#
# Otherwise identical to hidden_dim_256.yaml: LR=1e-3, warmup=1000,
# 10 epochs. The lr5e4_warmup2k run showed lowering LR made things
# worse, ruling out the "LR too high" branch.
#
# Result: embeddings/outputs/results/hidden_dim_256_h8.json
# Reproduce: python embeddings/scripts/run_experiment.py embeddings/configs/experiments/hidden_dim_256_h8.yaml

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  equations_file: data/raw/etp/equations.txt
  pairs_file: data/raw/etp/2025-08-11-vampire.json.gz
  pair_table_path: data/processed/implication_pairs.parquet
  graph_cache_path: data/processed/equation_graphs.pt
  holdout_path: data/splits/level1_holdout_seed42.parquet
  num_workers: 4

encoder:
  node_features: 9
  edge_features: 4
  hidden_dim: 256
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1

predictor:
  embed_dim: 256
  hidden_dim: 128
  num_layers: 2

ema:
  tau_start: 0.996
  tau_final: 0.999
  schedule: cosine

training:
  batch_size: 2048
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_steps: 1000
  epochs: 10
  grad_clip_norm: 1.0
  checkpoint_dir: embeddings/outputs/checkpoints
  max_val_batches: 200

loss:
  type: contrastive
  margin: 1.0
  true_weight: 1.7
  vicreg_weight: 0.0

holdout:
  level: 1
  level1_ratio: 0.10
  level2_num_equations: 500
  level3_num_equiv_classes: 150
  seed: 42

wandb:
  enabled: true
  project: jepa-equational-implication
  entity: null
  name: hidden_dim_256_h8
  log_every: 50

# embed_dim 128 → 256 — diminishing returns on the projection bottleneck?
#
# Hypothesis: embed_dim=128 lifted balanced accuracy by +1.5 pp over the
# 64-dim reference, demonstrating the projection was the bottleneck.
# Doubling again to 256 tests whether the embedding capacity has more
# headroom or if returns are already diminishing. Strategy: sweep
# {64, 128, 256} at 10 epochs each, lock in the smallest dim that
# captures most of the gain, then move to widening hidden_dim (the GAT
# stack itself).
#
# Encoder: final projection 256 → 256 = 65,792 params (was 32,896 at
# embed=128, 16,448 at embed=64). Predictor: 256 → 128 → 256 — note
# the predictor.hidden_dim is left at 128, so the predictor is now a
# real bottleneck (256 → 128 → 256), which aligns with the plan's
# "predictor smaller than encoder" intent. Total trainable params:
# encoder 203,264 + predictor 65,920 = 269,184 (~33% more than
# embed_dim_128's 203,392).
#
# Otherwise identical to embed_dim_128.yaml: 10 epochs, true_weight=1.7,
# everything else from the reference recipe.
#
# Result: embeddings/outputs/results/embed_dim_256.json
# Reproduce: python scripts/run_experiment.py embeddings/configs/experiments/embed_dim_256.yaml

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  equations_file: data/raw/etp/equations.txt
  pairs_file: data/raw/etp/2025-08-11-vampire.json.gz
  pair_table_path: data/processed/implication_pairs.parquet
  graph_cache_path: data/processed/equation_graphs.pt
  holdout_path: data/splits/level1_holdout_seed42.parquet
  num_workers: 4

encoder:
  node_features: 9
  edge_features: 4
  hidden_dim: 128
  embed_dim: 256
  num_layers: 4
  num_heads: 4
  dropout: 0.1

predictor:
  embed_dim: 256
  hidden_dim: 128
  num_layers: 2

ema:
  tau_start: 0.996
  tau_final: 0.999
  schedule: cosine

training:
  batch_size: 2048
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_steps: 1000
  epochs: 10
  grad_clip_norm: 1.0
  checkpoint_dir: embeddings/outputs/checkpoints
  max_val_batches: 200

loss:
  type: contrastive
  margin: 1.0
  true_weight: 1.7
  vicreg_weight: 0.0

holdout:
  level: 1
  level1_ratio: 0.10
  level2_num_equations: 500
  level3_num_equiv_classes: 150
  seed: 42

wandb:
  enabled: true
  project: jepa-equational-implication
  entity: null
  name: embed_dim_256
  log_every: 50

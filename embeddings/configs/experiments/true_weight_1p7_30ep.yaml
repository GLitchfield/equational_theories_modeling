# true_weight = 1.7, 30 epochs — does the ~0.81 ceiling lift with more training?
#
# Hypothesis: the 10-epoch true_weight_1p7 run was still learning at the
# end (train/avg_loss ▆█▆▃▃▃▂▂▁▁ on wandb, val/balanced_accuracy ▁▁▄▅▆▆▆▇██).
# Running the same config for 30 epochs should let us read off where the
# loss + bal_acc actually plateau, which tells us whether the current
# model/loss combination has more headroom or is bottlenecked elsewhere
# (capacity, regularization, loss form).
#
# Otherwise identical to true_weight_1p7.yaml. The cosine LR schedule
# auto-rescales to the new total_steps; warmup_steps stays at 1000
# (~0.3% of training).
#
# Result: outputs/results/true_weight_1p7_30ep.json
# Reproduce: python scripts/run_experiment.py configs/experiments/true_weight_1p7_30ep.yaml

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  equations_file: data/raw/etp/equations.txt
  pairs_file: data/raw/etp/2025-08-11-vampire.json.gz
  pair_table_path: data/processed/implication_pairs.parquet
  graph_cache_path: data/processed/equation_graphs.pt
  holdout_path: data/splits/level1_holdout_seed42.parquet
  num_workers: 4

encoder:
  node_features: 9
  edge_features: 4
  hidden_dim: 128
  embed_dim: 64
  num_layers: 4
  num_heads: 4
  dropout: 0.1

predictor:
  embed_dim: 64
  hidden_dim: 128
  num_layers: 2

ema:
  tau_start: 0.996
  tau_final: 0.999
  schedule: cosine

training:
  batch_size: 2048
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_steps: 1000
  epochs: 30
  grad_clip_norm: 1.0
  checkpoint_dir: outputs/checkpoints
  max_val_batches: 200

loss:
  type: contrastive
  margin: 1.0
  true_weight: 1.7
  vicreg_weight: 0.0

holdout:
  level: 1
  level1_ratio: 0.10
  level2_num_equations: 500
  level3_num_equiv_classes: 150
  seed: 42

wandb:
  enabled: true
  project: jepa-equational-implication
  entity: null
  name: true_weight_1p7_30ep
  log_every: 50
